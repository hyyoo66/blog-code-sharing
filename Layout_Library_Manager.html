      const centralHeaders = [];
      let offset = 0;

      entries.forEach(e => {
        const nameBytes = new TextEncoder().encode(e.name);
        const data = typeof e.data === 'string' ? new TextEncoder().encode(e.data) : e.data;
        const crc = crc32(data);

        const local = new Uint8Array(30 + nameBytes.length + data.length);
        const lv = new DataView(local.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(8, 0, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, data.length, true);
        lv.setUint32(22, data.length, true);
        lv.setUint16(26, nameBytes.length, true);
        local.set(nameBytes, 30);
        local.set(data, 30 + nameBytes.length);
        localHeaders.push(local);

        const central = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(central.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(10, 0, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, data.length, true);
        cv.setUint32(24, data.length, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint32(42, offset, true);
        central.set(nameBytes, 46);
        centralHeaders.push(central);

        offset += local.length;
      });

      const centralStart = offset;
      let centralSize = 0;
      centralHeaders.forEach(c => centralSize += c.length);

      const ecd = new Uint8Array(22);
      const ev = new DataView(ecd.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(8, entries.length, true);
      ev.setUint16(10, entries.length, true);
      ev.setUint32(12, centralSize, true);
      ev.setUint32(16, centralStart, true);

      const total = offset + centralSize + 22;
      const result = new Uint8Array(total);
      let pos = 0;
      localHeaders.forEach(l => { result.set(l, pos); pos += l.length; });
      centralHeaders.forEach(c => { result.set(c, pos); pos += c.length; });
      result.set(ecd, pos);
      return result;
    }

    const crc32Table = (() => {
      const t = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c;
      }
      return t;
    })();

    function crc32(data) {
      let crc = 0xFFFFFFFF;
      for (let i = 0; i < data.length; i++) crc = crc32Table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

<p:slideViewPr><p:cSldViewPr snapToGrid="1" snapToObjects="1"><p:cViewPr varScale="1"><p:scale><a:sx n="100" d="100"/><a:sy n="100" d="100"/></p:scale><p:origin x="0" y="0"/></p:cViewPr><p:guideLst/></p:cSldViewPr></p:slideViewPr>
<p:gridSpacing cx="${MM_EMU}" cy="${MM_EMU}"/>

      entries.push({ name: 'ppt/theme/theme1.xml', data:

<a:accent3><a:srgbClr val="A5A5A5"/></a:accent3><a:accent4><a:srgbClr val="FFC000"/></a:accent4>
<a:accent5><a:srgbClr val="5B9BD5"/></a:accent5><a:accent6><a:srgbClr val="70AD47"/></a:accent6>
<a:hlink><a:srgbClr val="0563C1"/></a:hlink><a:folHlink><a:srgbClr val="954F72"/></a:folHlink>
</a:clrScheme><a:fontScheme name="Office"><a:majorFont><a:latin typeface="Calibri"/><a:ea typeface=""/><a:cs typeface=""/></a:majorFont><a:minorFont><a:latin typeface="Calibri"/><a:ea typeface=""/><a:cs typeface=""/></a:minorFont></a:fontScheme><a:fmtScheme name="Office"><a:fillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:fillStyleLst><a:lnStyleLst><a:ln w="6350"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="6350"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="6350"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln></a:lnStyleLst><a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst><a:bgFillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:bgFillStyleLst></a:fmtScheme></a:themeElements></a:theme>` });

<p:cSld><p:bg><p:bgPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:effectLst/></p:bgPr></p:bg><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/></p:spTree></p:cSld>

        entries.push({ name: `ppt/slides/_rels/slide${i + 1}.xml.rels`, data:

<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>

    // 레이어 1개 = 슬라이드 1장. 좌표 기준점(refX,refY, 맨 좌측·맨 아래쪽 핀의 월드 좌표)이
    // 모든 슬라이드에서 항상 "왼쪽에서 30mm, 아래에서 20mm" 자리에 오도록 통일 좌표계로 그려서,
    // 슬라이드를 넘나들며 같은 자리를 겹쳐 비교하기 쉽게 한다(원점 표시는 생략, 기준점을 지나는
    // 가로/세로 주황색 안내선만 넣는다). 좌표계: 월드는 Y+가 위(캔버스와 동일), 슬라이드는 Y+가
    // 아래이므로 Y만 뒤집는다. (캔버스의 canvasRotation 보기-회전은 반영하지 않음 — 항상 정방향)
    const PPTX_REF_LEFT_MM = 30, PPTX_REF_BOTTOM_MM = 20;
    const PPTX_GUIDE_HEX = 'FFA500'; // 주황

    function buildFootprintLayerSlideXml(layerName, layer, refX, refY, slideWmm, slideHmm) {
      let spId = 2;
      let shapesXml = '';

      shapesXml += `<p:sp><p:nvSpPr><p:cNvPr id="${spId++}" name="Title"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>
<p:spPr><a:xfrm><a:off x="${mmToEmu(4)}" y="${mmToEmu(2)}"/><a:ext cx="${mmToEmu(slideWmm - 8)}" cy="${mmToEmu(7)}"/></a:xfrm><a:prstGeom prst="rect"/></p:spPr>
<p:txBody><a:bodyPr lIns="0" tIns="0" rIns="0" bIns="0"/><a:lstStyle/><a:p><a:r><a:rPr lang="en-US" sz="1400" b="1" dirty="0"><a:solidFill><a:srgbClr val="2C3E50"/></a:solidFill><a:latin typeface="Arial"/></a:rPr><a:t>${xmlText(layerName)}</a:t></a:r></a:p></p:txBody></p:sp>`;

      function pcbToSlideX(x) { return PPTX_REF_LEFT_MM + (x - refX); }
      function pcbToSlideY(y) { return (slideHmm - PPTX_REF_BOTTOM_MM) - (y - refY); }

      function addPptxText(text, x, y, w, h, hex, fontSize, name) {
        shapesXml += `<p:sp><p:nvSpPr><p:cNvPr id="${spId++}" name="${name || 'Txt'}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>
<p:spPr><a:xfrm><a:off x="${mmToEmu(x)}" y="${mmToEmu(y)}"/><a:ext cx="${mmToEmu(w)}" cy="${mmToEmu(h)}"/></a:xfrm><a:prstGeom prst="rect"/><a:noFill/><a:ln><a:noFill/></a:ln></p:spPr>
<p:txBody><a:bodyPr lIns="0" tIns="0" rIns="0" bIns="0" anchor="ctr"/><a:lstStyle/><a:p><a:pPr algn="ctr"/><a:r><a:rPr lang="en-US" sz="${fontSize}" b="1" dirty="0"><a:solidFill><a:srgbClr val="${hex}"/></a:solidFill><a:latin typeface="Arial"/></a:rPr><a:t>${xmlText(text)}</a:t></a:r></a:p></p:txBody></p:sp>`;
      }

      function addGuideLine(x1, y1, x2, y2) {
        const bx = Math.min(x1, x2), by = Math.min(y1, y2);
        const bw = Math.max(Math.abs(x2 - x1), 0.01), bh = Math.max(Math.abs(y2 - y1), 0.01);
        const flipH = x2 < x1 ? 1 : 0, flipV = y2 < y1 ? 1 : 0;
        // 실수로 끌리거나 회전/크기조절 되지 않도록 잠금(선택은 가능 — PPT의 "개체 잠금"과 동일).
        shapesXml += `<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="${spId++}" name="Guide"/><p:cNvCxnSpPr><a:cxnSpLocks noMove="1" noResize="1" noRot="1"/></p:cNvCxnSpPr><p:nvPr/></p:nvCxnSpPr>
<p:spPr><a:xfrm${flipH ? ' flipH="1"' : ''}${flipV ? ' flipV="1"' : ''}><a:off x="${mmToEmu(bx)}" y="${mmToEmu(by)}"/><a:ext cx="${mmToEmu(bw)}" cy="${mmToEmu(bh)}"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom>
<a:ln w="9525"><a:solidFill><a:srgbClr val="${PPTX_GUIDE_HEX}"/></a:solidFill><a:prstDash val="sysDot"/></a:ln></p:spPr></p:cxnSp>`;
      }

      // 기준점(맨 좌측·맨 아래쪽 핀)을 지나는 가로/세로 안내선 — 원점 표식은 없음. 슬라이드 끝에
      // 딱 붙지 않도록 양 끝에서 1mm씩 짧게.
      const gx = pcbToSlideX(refX), gy = pcbToSlideY(refY);
      addGuideLine(1, gy, slideWmm - 1, gy);
      addGuideLine(gx, 1, gx, slideHmm - 1);

      if (layer && layer.shapes && layer.shapes.length > 0) {
        const colorHex = (layer.color || '#FFFFFF').replace('#', '').toUpperCase();

        layer.shapes.forEach(s => {
          if (s.t === 'pad') {
            // 코퍼/솔더마스크 패드는 선으로 된 빈 원이 아니라 채워진 도형으로.
            const diam = Math.max(s.r * 2, 0.15);
            const cx = pcbToSlideX(s.x) - diam / 2, cy = pcbToSlideY(s.y) - diam / 2;
            shapesXml += `<p:sp><p:nvSpPr><p:cNvPr id="${spId++}" name="C"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>
<p:spPr><a:xfrm><a:off x="${mmToEmu(cx)}" y="${mmToEmu(cy)}"/><a:ext cx="${mmToEmu(diam)}" cy="${mmToEmu(diam)}"/></a:xfrm><a:prstGeom prst="ellipse"/>
<a:solidFill><a:srgbClr val="${colorHex}"/></a:solidFill><a:ln><a:noFill/></a:ln></p:spPr></p:sp>`;
          } else if (s.t === 'arc') {
            // buildLayerFilesForFootprint()가 만드는 arc는 항상 완전한 원(실크 원형 마크) — 실제
            // 실크 테두리 선이므로 패드와 달리 채우지 않고 그대로 테두리 원으로 둔다.
            const diam = Math.max(s.r * 2, 0.15);
            const cx = pcbToSlideX(s.cx) - diam / 2, cy = pcbToSlideY(s.cy) - diam / 2;
            const lw = mmToEmu(s.w || 0.15);
            shapesXml += `<p:sp><p:nvSpPr><p:cNvPr id="${spId++}" name="C"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>
<p:spPr><a:xfrm><a:off x="${mmToEmu(cx)}" y="${mmToEmu(cy)}"/><a:ext cx="${mmToEmu(diam)}" cy="${mmToEmu(diam)}"/></a:xfrm><a:prstGeom prst="ellipse"/>
<a:noFill/><a:ln w="${lw}"><a:solidFill><a:srgbClr val="${colorHex}"/></a:solidFill></a:ln></p:spPr></p:sp>`;
          } else if (s.t === 'rect') {
            // 사각 패드(SMD)도 pad와 동일하게 채워진 도형으로.
            const rw = Math.max(s.w, 0.05), rh = Math.max(s.h, 0.05);
            const cx = pcbToSlideX(s.x), cy = pcbToSlideY(s.y);
            // 월드(Y+위) -> 슬라이드(Y+아래) 변환으로 좌우 대칭이 뒤집히므로 회전 각도 부호도 같이 뒤집는다.
            const rotDeg = ((-(s.rot || 0)) % 360 + 360) % 360;
            shapesXml += `<p:sp><p:nvSpPr><p:cNvPr id="${spId++}" name="Rc"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>
<p:spPr><a:xfrm rot="${Math.round(rotDeg * 60000)}"><a:off x="${mmToEmu(cx - rw / 2)}" y="${mmToEmu(cy - rh / 2)}"/><a:ext cx="${mmToEmu(rw)}" cy="${mmToEmu(rh)}"/></a:xfrm><a:prstGeom prst="rect"/>
<a:solidFill><a:srgbClr val="${colorHex}"/></a:solidFill><a:ln><a:noFill/></a:ln></p:spPr></p:sp>`;
          } else if (s.t === 'line') {
            const x1 = pcbToSlideX(s.x1), y1 = pcbToSlideY(s.y1);
            const x2 = pcbToSlideX(s.x2), y2 = pcbToSlideY(s.y2);
            const bx = Math.min(x1, x2), by = Math.min(y1, y2);
            const bw = Math.max(Math.abs(x2 - x1), 0.01), bh = Math.max(Math.abs(y2 - y1), 0.01);
            const flipH = x2 < x1 ? 1 : 0, flipV = y2 < y1 ? 1 : 0;
            const lw = Math.max(mmToEmu(s.w || 0.15), 3175);
            shapesXml += `<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="${spId++}" name="L"/><p:cNvCxnSpPr/><p:nvPr/></p:nvCxnSpPr>
<p:spPr><a:xfrm${flipH ? ' flipH="1"' : ''}${flipV ? ' flipV="1"' : ''}><a:off x="${mmToEmu(bx)}" y="${mmToEmu(by)}"/><a:ext cx="${mmToEmu(bw)}" cy="${mmToEmu(bh)}"/></a:xfrm><a:prstGeom prst="line"><a:avLst/></a:prstGeom>
<a:ln w="${lw}"><a:solidFill><a:srgbClr val="${colorHex}"/></a:solidFill><a:round/></a:ln></p:spPr></p:cxnSp>`;
          } else if (s.t === 'text' && s.content) {
            const fontMm = (s.fontSize || 0.5) / 3; // 풋프린트 실크 글자는 1/3 크기로 축소
            const tw = ((s.content.length || 1) * fontMm * 0.65) + fontMm * 0.15;
            const th = fontMm * 1.3;
            const boxX = pcbToSlideX(s.x), boxYBottom = pcbToSlideY(s.y);
            const sz = Math.max(400, Math.round(fontMm / 0.3528 * 100));
            addPptxText(s.content, boxX, boxYBottom - th, tw, th, colorHex, sz, 'Txt');
          }
        });
      }

      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
<p:cSld><p:bg><p:bgPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:effectLst/></p:bgPr></p:bg>
<p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr/>
${shapesXml}
</p:spTree></p:cSld></p:sld>`;
    }

    // 화면(캔버스)에 지금 보이는 풋프린트를, 레이어마다 슬라이드를 따로 만들어서 PPTX로 내보낸다.
    // 레이어 하나 끝날 때마다 setTimeout(...,0)으로 이벤트 루프에 양보하고 pingHeartbeat()를 불러서,
    // 도형이 많아 시간이 걸려도 그 사이사이에 하트비트가 나가게 한다.
    function exportCurrentFootprintToPPTX() {
      const lib = currentLib();
      if (!lib || currentSymNum === null) { addLog('❌ 먼저 풋프린트를 선택하세요.'); return; }
      const fp = lib.parsed.footprints.find(f => f.symNum === currentSymNum);
      if (!fp) { addLog('❌ 풋프린트를 찾을 수 없습니다.'); return; }

      const visibleNames = Object.keys(files)
        .filter(name => files[name].visible && files[name].shapes && files[name].shapes.length > 0)
        .sort((a, b) => {
          const pa = files[a].priority !== undefined ? files[a].priority : 5, pb = files[b].priority !== undefined ? files[b].priority : 5;
          return pa !== pb ? pa - pb : a.localeCompare(b);
        });
      if (visibleNames.length === 0) { addLog('❌ 표시중인 레이어가 없습니다(레이어를 켜주세요).'); return; }

      const bb = computeContentBBox();
      if (!bb) { addLog('❌ 내보낼 도형이 없습니다.'); return; }

      // 기준점: 맨 좌측·맨 아래쪽 핀(핀 X 최소값, 핀 Y 최소값) — 모든 슬라이드에서 이 자리가
      // 왼쪽에서 30mm, 아래에서 20mm에 오도록 통일해서 그린다.
      let refX = Infinity, refY = Infinity;
      for (const pin of fp.pins) { refX = Math.min(refX, pin.x); refY = Math.min(refY, pin.y); }
      if (!isFinite(refX)) { refX = bb.minX; refY = bb.minY; }

      const btn = document.querySelector('[onclick="exportCurrentFootprintToPPTX()"]');
      if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; }
      status.textContent = 'PPTX 생성 중...';
      addLog(`📊 PPTX 생성 시작: ${fp.name} (레이어 ${visibleNames.length}장)`);

      const topMargin = 15, rightMargin = 10; // topMargin: 제목 자리
      const DEFAULT_W = 140, DEFAULT_H = 100;
      const slideWmm = Math.max(DEFAULT_W, Math.ceil(PPTX_REF_LEFT_MM + (bb.maxX - refX) + rightMargin));
      const slideHmm = Math.max(DEFAULT_H, Math.ceil(topMargin + PPTX_REF_BOTTOM_MM + (bb.maxY - refY)));

      function fail(err) {
        addLog('⚠️ PPTX 생성 실패: ' + err.message);
        alert('PPTX 생성 실패: ' + err.message);
        status.textContent = '준비 완료';
        if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
      }

      setTimeout(() => {
        const slideList = [];
        let idx = 0;
        function processNext() {
          try {
            if (idx >= visibleNames.length) {
              const zipEntries = buildPptxEntries(slideList, mmToEmu(slideWmm), mmToEmu(slideHmm));
              const zipData = createZip(zipEntries);
              const blob = new Blob([zipData], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = fp.name.replace(/[\\/:*?"<>|]/g, '_') + '.pptx';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              addLog(`✅ PPTX 저장 완료: ${a.download} (${slideList.length}개 슬라이드)`);
              status.textContent = `PPTX 저장 완료 (${slideList.length}개 슬라이드)`;
              if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
              return;
            }
            const name = visibleNames[idx];
            const xml = buildFootprintLayerSlideXml(name, files[name], refX, refY, slideWmm, slideHmm);
            slideList.push({ xml });
            idx++;
            pingHeartbeat(); // 레이어(슬라이드) 하나 끝날 때마다 서버에 살아있다고 알림
            status.textContent = `PPTX 생성 중... (${idx}/${visibleNames.length}) — ${name}`;
            setTimeout(processNext, 0);
          } catch (err) { fail(err); }
        }
        processNext();
      }, 50);
    }

    function selectFootprint(symNum) {
      const lib = currentLib();
      if (!lib) return;
      currentSymNum = symNum;
      lib.lastSymNum = symNum; // 이 라이브러리로 다시 돌아왔을 때 복원용
      const curFp = lib.parsed.footprints.find(f => f.symNum === symNum);
      currentInsertion = curFp ? { x: curFp.insX || 0, y: curFp.insY || 0 } : null;
      files = buildLayerFilesForFootprint(lib.parsed, symNum);
      const realNames = sortLayersByOrder(Object.keys(files).filter(n => n !== '핀번호'));
      // priority 낮을수록 나중에(맨 위에) 그려지므로, 핀번호 라벨은 항상 다른 도형들 위로 보이게 맨 앞에 둔다.
      const sortedNames = files['핀번호'] ? ['핀번호', ...realNames] : realNames;
      let ci = 0;
      sortedNames.forEach((name, idx) => {
        files[name].priority = idx;
        const matched = matchLayerColor(name, defaultColorsMIN);
        files[name].color = matched || standardColors[ci++ % standardColors.length];
      });
      loadSettings();
      if (files['핀번호']) {
        files['핀번호'].priority = 0;      // 저장된 설정이 있어도 항상 맨 위(마지막에 그려짐)로 강제
        files['핀번호'].color = '#808080'; // 색도 강제 — 예전에 저장된 색이 되살아나지 않도록
      }
      refreshFpList();
      refreshLayerList();
      selectedShapes = []; updateDebugInfo();
      contentBBox = null;
      const fp = lib.parsed.footprints.find(f => f.symNum === symNum);
      addLog(`📦 풋프린트 전환: ${fp ? fp.name : symNum}`);
      if (fp) {
        let missingPs = 0, allUndef = 0;
        for (const pin of fp.pins) {
          const ps = lib.parsed.padstacks[pin.padstack];
          if (!ps) { missingPs++; continue; }
          if (!Object.values(ps).some(g => g)) allUndef++;
        }
        if (missingPs > 0) addLog(`⚠️ 핀 ${missingPs}개가 참조하는 패드스택 번호가 파일에 없음(THRU 정의 누락) — pin.padstack이 THRU 목록에 없는 경우`);
        if (allUndef > 0) addLog(`⚠️ 핀 ${allUndef}개의 패드스택이 모든 레이어에서 UNDEF (원본 자체에 형상 정의가 없음)`);
      }
      fitAll();
    }

    // =======================================================
    // VI. 라이브러리 관리 (다중 라이브러리 / 새로 만들기 / 추가 / 삭제 / 저장)
    // =======================================================
    function dedupedFootprintCount(parsed) {
      const sigs = new Set();
      for (const fp of parsed.footprints) sigs.add(footprintSignature(fp, parsed));
      return sigs.size;
    }

    function refreshLibList() {
      const div = document.getElementById('libList');
      div.innerHTML = '';
      if (libraries.length === 0) { div.innerHTML = '<div class="fp-empty">라이브러리를 추가하거나 새로 만드세요.</div>'; return; }
      libraries.forEach(lib => {
        const row = document.createElement('div');
        row.className = 'fp-item' + (lib.id === currentLibId ? ' active' : '');
        row.innerHTML = `<span class="fp-badge">${dedupedFootprintCount(lib.parsed)}개</span><span class="fp-name">${lib.name}</span>`;
        row.onclick = () => selectLibrary(lib.id);
        div.appendChild(row);
      });
    }

    function selectLibrary(id) {
      currentLibId = id;
      selectedFpSymNums = new Set(); fpSelectAnchorSymNum = null;
      fpFilterText = '';
      const fsi = document.getElementById('fpSearch'); if (fsi) fsi.value = '';
      refreshLibList();
      const lib = currentLib();
      if (!lib) { refreshFpList(); refreshLayerList(); return; }
      if (lib.parsed.footprints.length > 0) {
        const remembered = lib.lastSymNum !== undefined && lib.parsed.footprints.some(f => f.symNum === lib.lastSymNum);
        if (remembered) {
          selectFootprint(lib.lastSymNum);
        } else {
          const first = [...lib.parsed.footprints].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }))[0];
          selectFootprint(first.symNum);
        }
      } else {
        files = {}; currentSymNum = null; refreshFpList(); refreshLayerList(); draw();
        status.textContent = `${lib.name} — 풋프린트 없음`;
      }
    }

    function createNewLibraryNamed(name) {
      const text = NEW_LIB_SKELETON + '\n(End)))\n';
      const lib = { id: 'lib' + (libIdCounter++), name: name.trim() + '.MIN', rawText: text, parsed: parseMIN(text) };
      libraries.push(lib);
      addLog(`🆕 새 라이브러리 생성: ${lib.name}`);
      selectLibrary(lib.id);
      return lib;
    }

    function createNewLibrary() {
      // 풋프린트를 선택해둔 상태에서 누르면, 빈 라이브러리 대신 그 풋프린트(들)로 채운 라이브러리를 만든다.
      //   - 1개 선택: 그 이름으로 새 라이브러리 생성 + 복사
      //   - 2개 이상 선택: 화면에 보이는 순서상 맨 위로 선택된 것의 이름으로 생성 + 전부 복사 + 곧바로 Save
      if (selectedFpSymNums.size > 0) { createNewLibraryFromSelection(); return; }
      const name = prompt('새 라이브러리 이름', 'NewLib' + libIdCounter);
      if (!name) return;
      createNewLibraryNamed(name);
    }

    function createNewLibraryFromSelection() {
      const lib = currentLib();
      if (!lib) { addLog('❌ 라이브러리가 없습니다.'); return; }
      const multi = selectedFpSymNums.size > 1;
      // "화면에 보이는 순서상 맨 위로 선택된 것" — fpDisplayOrder는 목록이 그려질 때마다 갱신되는,
      // 지금 화면에 보이는 순서 그대로의 SYM 번호 목록이다.
      const orderedSelected = fpDisplayOrder.filter(n => selectedFpSymNums.has(n));
      const topSymNum = orderedSelected[0];
      const topFp = lib.parsed.footprints.find(f => f.symNum === topSymNum);
      if (!topFp) { addLog('❌ 선택된 풋프린트를 찾지 못했습니다.'); return; }

      // 1개 선택: 물어보지 않고 바로 그 이름으로 생성. 2개 이상: 이름을 물어봄(기본값 = 맨 위 선택 항목).
      let newName = topFp.name;
      if (multi) {
        newName = prompt('새 라이브러리 이름', topFp.name);
        if (!newName) return;
      }

      createNewLibraryNamed(newName);
      const savedClip = clipboardBlocks; // 사용자의 클립보드는 건드리지 않고 복구
      clipboardBlocks = buildClipFromLib(lib, orderedSelected);
      pasteFootprints();
      clipboardBlocks = savedClip;
    }

    function removeCurrentLibrary() {
      const lib = currentLib();
      if (!lib) return;
      if (!confirm(`"${lib.name}" 라이브러리를 세션에서 뺄까요? (실제 파일은 지워지지 않습니다)`)) return;
      libraries = libraries.filter(l => l.id !== lib.id);
      addLog(`🗑️ 라이브러리 제거: ${lib.name}`);
      if (libraries.length > 0) selectLibrary(libraries[0].id);
      else {
        currentLibId = null; files = {}; currentSymNum = null;
        refreshLibList(); refreshFpList(); refreshLayerList(); draw();
        status.textContent = '준비 완료';
      }
    }

    // 열려 있는 라이브러리를 전부 하나로 합친다.
    // 지금 선택 중인 라이브러리를 바탕(헤더·단위·레이어 정의)으로 삼고, 나머지의 풋프린트를
    // 붙여넣기와 똑같은 방식(단위 재환산 / 레이어 이름 재매핑 / 번호 순차 재배정 / 이름 충돌 시 _2)
    // 으로 넣는다. 이름 기본값은 "선택한 라이브러리 이름_merge". 원본 라이브러리들은 그대로 남는다.
    function mergeLibraries() {
      if (libraries.length < 2) { addLog('❌ 합치려면 라이브러리가 2개 이상 열려 있어야 합니다.'); return; }
      const baseLib = currentLib() || libraries[0]; // 지금 선택 중인 라이브러리를 바탕으로 삼는다
      const defaultBase = baseLib.name.replace(/\.(min|llb|max|txt)$/i, '') + '_merge';
      const newName = prompt('합친 라이브러리 이름', defaultBase);
      if (!newName) return;

      const sources = libraries.filter(l => l !== baseLib); // 바탕을 뺀 나머지 — merged를 push하기 전에 확정
      const merged = {
        id: 'lib' + (libIdCounter++),
        name: newName.trim() + '.MIN',
        rawText: baseLib.rawText,
        parsed: parseMIN(baseLib.rawText)
      };
      libraries.push(merged);
      currentLibId = merged.id;

      const savedClip = clipboardBlocks;    // 사용자의 클립보드는 건드리지 않고 복구
      let added = 0;
      for (const src of sources) {
        // 목록에 실제로 보이는 대표 풋프린트만 합친다 (VIA/파생본/이름_숫자 배치 사본 제외)
        const symNums = getRepresentativeFootprints(src.parsed).map(f => f.symNum);
        if (symNums.length === 0) continue;
        clipboardBlocks = buildClipFromLib(src, symNums);
        pasteFootprints();
        added += symNums.length;
      }
      clipboardBlocks = savedClip;

      addLog(`🔗 합치기 완료: ${merged.name} — 바탕 "${baseLib.name}" + 풋프린트 ${added}개`);
      selectLibrary(merged.id);
    }

    // Dedup은 원본 라이브러리를 절대 건드리지 않는다.
    // 처음 실행할 때 "<이름>_dedup" 사본을 새로 만들어 거기서만 작업하고, 같은 세션에서 이어서
    // 누르는 정리 작업은 사본을 또 만들지 않고 그 사본에 계속 쌓는다(원본은 그대로, 처음 만든
    // 사본 하나만 누적으로 정리됨).
    function ensureWorkingCopy() {
      const lib = currentLib();
      if (!lib) return null;
      if (lib.isDedupCopy) return lib; // 이미 사본이면 계속 여기서 작업
      // 원본 탭에서 이미 사본을 만들어뒀다가 다시 원본 탭으로 돌아온 경우 그 사본을 재사용한다.
      // 안 그러면 누를 때마다 사본이 새로 생기고, 정규화해둔 사본을 두고 원본에서 또 사본을 파서
      // Dedup을 돌리는 사고가 난다.
      const existing = libraries.find(l => l.isDedupCopy && l.sourceId === lib.id);
      if (existing) { currentLibId = existing.id; refreshLibList(); return existing; }
      const name = lib.name.replace(/\.(min|llb|max|txt)$/i, '') + '_dedup';
      const copy = {
        id: 'lib' + (libIdCounter++),
        name: name + '.MIN',
        rawText: lib.rawText,
        parsed: parseMIN(lib.rawText),
        isDedupCopy: true,
        sourceId: lib.id
      };
      libraries.push(copy);
      currentLibId = copy.id;
      refreshLibList();
      addLog(`📄 원본은 그대로 두고 "${copy.name}" 사본을 만들어 여기서부터 작업합니다.`);
      return copy;
    }

    // 보드에서 뽑아낸 라이브러리는 &Comp(RefDes) 라벨이 "보드 위 그 위치"를 그대로 갖고 있어서,
    // 풋프린트마다 실크(SSTOP/SSBOT 어느 쪽이든) 라벨 위치와 회전이 제각각이다(예: LLC_30KW 라이브러리).
    // 거리와 상관없이 라이브러리 전체 모든 풋프린트에 무조건 적용해서
    //   - 위치: 내용물(코퍼+실크) 바운딩 박스 위쪽, 첫 글자가 왼쪽 위 모서리에 오도록(안 겹치게)
    //   - 회전: 정상(0도)으로
    // 동일한 규칙으로 통일한다. removeDuplicateContentFootprints()가 중복 삭제 전에 항상 먼저
    // 호출한다(Dedup 버튼 하나로 정규화+삭제가 같이 됨) — 위치/회전을 먼저 통일해둬야 "이름/라벨
    // 위치만 다르고 내용은 같은" 변종을 핀/패드 형상만으로 신뢰성 있게 잡아낼 수 있다.
    function applyRefDesFix(lib) {
      const parsed = lib.parsed;
      let rawText = lib.rawText;
      let fixedCount = 0;
      const GAP_MM = 1.0; // 내용물 위쪽 여백 (기존 KiCad-가져오기 라벨 배치와 동일한 관례)

      for (const fp of parsed.footprints) {
        if (/^VIA\d*$/i.test(fp.name)) continue;
        const refDes = parsed.textList.find(t => t.sym === fp.symNum && t.isRefDes);
        if (!refDes) continue;

        // 내용물(코퍼 패드 + 실크) 바운딩 박스
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, hasContent = false;
        for (const pin of fp.pins) {
          const ps = parsed.padstacks[pin.padstack];
          let ext = 0;
          if (ps) {
            for (const ln in ps) {
              const g = ps[ln];
              if (!g) continue;
              ext = Math.max(ext, g.type === 'round' ? g.r : Math.max(g.hw, g.hh));
            }
          }
          minX = Math.min(minX, pin.x - ext); maxX = Math.max(maxX, pin.x + ext);
          minY = Math.min(minY, pin.y - ext); maxY = Math.max(maxY, pin.y + ext);
          hasContent = true;
        }
        for (const obs of parsed.obsList) {
          if (obs.sym !== fp.symNum) continue;
          for (const p of obs.pts) {
            minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
            hasContent = true;
          }
        }
        if (!hasContent) continue;

        // 거리와 상관없이 모든 풋프린트에 무조건 적용 — 위치/회전을 동일한 규칙으로 통일해야
        // "내용은 같은데 라벨만 달랐던" 변종을 나중에 신뢰성 있게 찾아낼 수 있다.
        const newXu = Math.round(minX / parsed.mmPerUnit);
        const newYu = Math.round((maxY + GAP_MM) / parsed.mmPerUnit);
        let newRaw = refDes.raw.replace(/(\(H\s+-?[\d.]+\))\s*\(-?[\d.]+\s+-?[\d.]+\)/, `$1 (${newXu} ${newYu})`);
        newRaw = newRaw.replace(/\(R\s+-?[\d.]+\)/, ''); // 회전 태그 제거 -> 정상(0도)

        if (newRaw !== refDes.raw && rawText.includes(refDes.raw)) {
          rawText = rawText.replace(refDes.raw, () => newRaw);
          fixedCount++;
        }
      }

      if (fixedCount === 0) return 0;
      lib.rawText = rawText;
      lib.parsed = parseMIN(lib.rawText); // "같은 풋프린트인지" 판단은 이 재파싱 이후 상태로 이뤄짐
      return fixedCount;
    }

    // 화면에 보이는(getRepresentativeFootprints) 풋프린트들 중 핀/패드 형상(footprintSignature)이
    // 완전히 같은 그룹에서 대표 하나만 남기고 나머지를 실제로 지운다 — 되돌릴 수 없음.
    // deleteSelectedFootprints()와 같은 방식으로, 남은 풋프린트가 계속 쓰는 패드스택은 안 건드린다.
    // 원본이 아니라 ensureWorkingCopy()가 만든 _dedup 사본에서만 동작한다.
    function removeDuplicateContentFootprints() {
      const lib = ensureWorkingCopy();
      if (!lib) { addLog('❌ 라이브러리가 없습니다.'); return; }
      const preFixCount = applyRefDesFix(lib); // &Comp 정규화를 먼저 해둬야 "이름만 다른 같은 풋프린트"를 신뢰성 있게 잡는다
      const parsed = lib.parsed;

      const groups = new Map();
      for (const fp of getRepresentativeFootprints(parsed)) {
        const sig = footprintSignature(fp, parsed);
        if (!groups.has(sig)) groups.set(sig, []);
        groups.get(sig).push(fp);
      }
      const natSort = (a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' });

      const removeSymNums = new Set();
      const removedNames = [];
      let dupeGroupCount = 0;
      for (const members of groups.values()) {
        if (members.length < 2) continue;
        dupeGroupCount++;
        members.sort((a, b) => natSort(a.name, b.name));
        for (let i = 1; i < members.length; i++) {
          removeSymNums.add(members[i].symNum);
          removedNames.push(members[i].name);
        }
      }

      if (removeSymNums.size === 0) {
        if (preFixCount > 0) {
          addLog(`✏️ &Comp 라벨 정리: ${preFixCount}개 위치/회전 통일 (지울 중복 풋프린트는 없음)`);
          refreshFpList();
          if (currentSymNum !== null) selectFootprint(currentSymNum);
        } else {
          addLog('ℹ️ 지울 중복 풋프린트가 없습니다.');
        }
        return;
      }
      // 물어보지 않고 바로 지운다 — 원본이 아니라 _dedup 사본에서만 동작하므로 되돌릴 필요가 있으면
      // 사본을 다시 만들면 된다.

      let text = lib.rawText;
      // 남을 풋프린트들이 계속 쓰는 패드스택은 건드리지 않고, 삭제 대상만 독점 사용하던 패드스택만 같이 지운다.
      const stillUsedPadstacks = new Set();
      for (const fp of parsed.footprints) {
        if (removeSymNums.has(fp.symNum)) continue;
        for (const pin of fp.pins) stillUsedPadstacks.add(pin.padstack);
      }
      const toDeletePadstacks = new Set();
      for (const fp of parsed.footprints) {
        if (!removeSymNums.has(fp.symNum)) continue;
        for (const pin of fp.pins) if (!stillUsedPadstacks.has(pin.padstack)) toDeletePadstacks.add(pin.padstack);
      }

      for (const blk of extractBlocks(text, 'SYM')) {
        const m = blk.match(/^\(SYM\s+(\d+)/);
        if (m && removeSymNums.has(parseInt(m[1]))) text = text.replace(blk, '');
      }
      for (const blk of extractBlocks(text, 'THRU')) {
        const m = blk.match(/^\(THRU\s+(\d+)/);
        if (m && toDeletePadstacks.has(parseInt(m[1]))) text = text.replace(blk, '');
      }
      for (const blk of extractBlocks(text, 'Obs')) {
        const m = blk.match(/\(Sym\s+(\d+)\)/);
        if (m && removeSymNums.has(parseInt(m[1]))) text = text.replace(blk, '');
      }
      for (const blk of extractBlocks(text, 'Text')) {
        const m = blk.match(/\(Sym\s+(\d+)\)/);
        if (m && removeSymNums.has(parseInt(m[1]))) text = text.replace(blk, '');
      }

      lib.rawText = text;
      lib.parsed = parseMIN(text);
      const namesPreview = removedNames.slice(0, 15).join(', ') + (removedNames.length > 15 ? ` 외 ${removedNames.length - 15}개` : '');
      addLog(`🗑️ 중복 제거: ${removeSymNums.size}개 삭제 (그룹 ${dupeGroupCount}개, 안 쓰는 패드스택 ${toDeletePadstacks.size}개도 같이 정리됨${preFixCount > 0 ? `, &Comp 라벨 ${preFixCount}개 위치/회전도 같이 통일됨` : ''}) — ${namesPreview}`);
      selectedFpSymNums = new Set(); fpSelectAnchorSymNum = null;
      refreshLibList();
      if (lib.parsed.footprints.length > 0) {
        const first = [...lib.parsed.footprints].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }))[0];
        selectFootprint(first.symNum);
      }
    }

    async function downloadTextFile(text, filename) {
      // Chrome/Edge는 실제 폴더 선택 대화상자로 저장 (경로를 직접 고를 수 있음)
      if (window.showSaveFilePicker) {
        try {
          const ext = (filename.match(/\.[^.]+$/) || ['.min'])[0].toLowerCase();
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: 'MIN Interchange', accept: { 'text/plain': [ext] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(text);
          await writable.close();
          addLog(`💾 저장: ${handle.name}`);
          return handle.name;
        } catch (err) {
          if (err.name === 'AbortError') { addLog('저장 취소됨'); return null; }
          addLog(`⚠️ 폴더 선택 저장 실패, 기본 다운로드로 대체: ${err.message}`);
        }
      }
      // 지원 안 되는 브라우저: 기존 방식 (브라우저 기본 다운로드 폴더로 저장됨)
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      addLog(`💾 저장: ${filename}`);
      return filename;
    }

    function renameCurrentLibrary() {
      const lib = currentLib();
      if (!lib) { addLog('❌ 이름 바꿀 라이브러리가 없습니다.'); return; }
      const base = lib.name.replace(/\.(min|llb|max|txt)$/i, '');
      const newName = prompt('라이브러리 이름 바꾸기', base);
      if (!newName) return;
      lib.name = newName.trim() + '.MIN';
      refreshLibList();
      addLog(`✏️ 이름 변경: ${lib.name}`);
    }

    async function saveCurrentLibraryAs() {
      const lib = currentLib();
      if (!lib) { addLog('❌ 저장할 라이브러리가 없습니다.'); return; }
      // 확장자까지 그대로 보여준다(예: SINWAVE_PWM.MIN) — 실제 저장될 파일 이름을 미리 알 수 있게.
      const defaultName = lib.name.replace(/\.(llb|max|txt)$/i, '.MIN');
      const typed = prompt('저장할 파일 이름', defaultName);
      if (!typed) return;
      const trimmed = typed.trim();
      const finalName = /\.min$/i.test(trimmed) ? trimmed : trimmed + '.MIN'; // 확장자를 지웠으면 다시 붙여줌
      const savedName = await downloadTextFile(lib.rawText, finalName);
      if (!savedName) return;
      lib.name = savedName;
      refreshLibList();
    }

    function addLibraryFromText(text, name) {
      status.textContent = "MIN 파싱 중..."; setBusy(true);
      try {
        const parsed = parseMIN(text);
        const lib = { id: 'lib' + (libIdCounter++), name, rawText: text, parsed };
        libraries.push(lib);
        if (!parsed.inchFactorFound) addLog('⚠️ InchFactor를 못 찾아 기본값(10nm/unit)으로 가정했습니다 — 치수가 이상하면 원본 헤더를 확인하세요.');
        addLog(`📄 ${name}: 레이어 ${Object.keys(parsed.layerNames).length}개, 패드스택 ${Object.keys(parsed.padstacks).length}개, 풋프린트 ${parsed.footprints.length}개`);
        if (parsed.warnings.length > 0) {
          addLog(`⚠️ 인식 못한 패드 형상 ${parsed.warnings.length}개 (해당 레이어는 UNDEF 처리 — 그 핀은 그 레이어에서 안 보임)`);
          parsed.warnings.forEach(w => addLog('&nbsp;&nbsp;' + w));
        }
        if (parsed.footprints.length === 0) addLog('⚠️ SYM 블록이 없습니다 — maxminw.exe로 뽑은 .MIN 파일이 맞는지 확인하세요.');
        selectLibrary(lib.id);
      } catch (err) {
        status.textContent = "파싱 에러: " + err.message;
        addLog('❌ 파싱 에러: ' + err.message);
      }
      setBusy(false);
    }

    // .LLB/.MAX는 브라우저가 직접 못 읽으므로(바이너리) 로컬 브릿지 서버(min_bridge_server.py)에
    // 맡겨서 maxminw.exe로 변환시킨 뒤 MIN 텍스트를 돌려받는다. .MIN/.txt는 그대로 읽는다.
    const BRIDGE_URL = 'http://127.0.0.1:8765/convert';

    // Dedup/PPT 내보내기처럼 오래 걸릴 수 있는 동기 작업 중간중간에 찔러주는 하트비트.
    // initHeartbeat()의 setInterval은 메인 스레드가 계속 바쁘면 콜백 자체가 못 돌아서 무용지물이라,
    // 오래 걸리는 작업을 청크로 쪼갠 뒤 청크 사이에서 이걸 직접 호출해야 서버가 "페이지 죽음"으로
    // 오판해 자기 자신을 끄는 걸(및 그로 인한 탭 자동 닫힘) 막을 수 있다. 실패해도 무시(best-effort).
    function pingHeartbeat() {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      try { fetch(BRIDGE_URL.replace('/convert', '/heartbeat'), { method: 'POST' }).catch(() => {}); } catch (e) {}
    }

    async function loadFile(file) {
      const ext = file.name.slice(file.name.lastIndexOf('.')).toLowerCase();
      if (ext === '.llb' || ext === '.max') {
        status.textContent = `${file.name} → MIN 변환 중 (브릿지 서버 호출)...`;
        setBusy(true);
        try {
          const buf = await file.arrayBuffer();
          const res = await fetch(BRIDGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/octet-stream', 'X-File-Ext': ext },
            body: buf
          });
          const text = await res.text();
          if (!res.ok) throw new Error(text);
          addLog(`🔄 ${file.name} → MIN 자동 변환 완료 (브릿지 서버)`);
          addLibraryFromText(text, file.name.replace(/\.(llb|max)$/i, '.MIN'));
        } catch (err) {
          setBusy(false);
          status.textContent = "브릿지 서버 연결 실패";
          addLog(`❌ .LLB/.MAX 자동 변환 실패: ${err.message}`);
          addLog(`👉 같은 폴더의 min_bridge_server.py를 먼저 실행하세요 ("python min_bridge_server.py"). 또는 maxminw.exe로 직접 .MIN을 만들어 여세요.`);
        }
      } else {
        const text = await file.text();
        addLibraryFromText(text, file.name);
      }
    }

    document.getElementById("addLibFile").addEventListener("change", async e => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      loadFile(file);
    });

    // 드래그&드롭 = 라이브러리 추가
    canvas.addEventListener("dragover", e => { e.preventDefault(); });
    canvas.addEventListener("drop", async e => {
      e.preventDefault();
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      loadFile(file);
    });

    // =======================================================
    // VII. 풋프린트 복사 / 붙여넣기 / 지우기
    // =======================================================
    function getMaxNum(text, tag) {
      let max = 0;
      const re = new RegExp('^\\(' + tag + '\\s+(\\d+)');
      for (const blk of extractBlocks(text, tag)) {
        const m = blk.match(re);
        if (m) max = Math.max(max, parseInt(m[1]));
      }
      return max;
    }
    function getMinUid(text) {
      let min = 0;
      for (const m of text.matchAll(/\(Uid\s+(-?\d+)/g)) min = Math.min(min, parseInt(m[1]));
      return min;
    }

    function selectedOrCurrentSymNums() {
      if (selectedFpSymNums.size > 0) return [...selectedFpSymNums];
      return currentSymNum !== null ? [currentSymNum] : [];
    }

    function copySelectedFootprintNames() {
      const lib = currentLib();
      if (!lib) { addLog('❌ 라이브러리가 없습니다.'); return; }
      const symNums = selectedOrCurrentSymNums();
      if (symNums.length === 0) { addLog('❌ 이름을 복사할 풋프린트를 먼저 선택하세요.'); return; }
      const symSet = new Set(symNums);
      const names = lib.parsed.footprints.filter(f => symSet.has(f.symNum)).map(f => f.name);
      copyTextToClipboard(names.join('\n'), () => addLog(`📋 이름 복사: ${names.join(', ')}`));
    }

    // 지정한 풋프린트들을 "붙여넣기용 블록 묶음"으로 만든다 (Copy 와 Merge 가 공용으로 씀).
    function buildClipFromLib(lib, symNums) {
      const symSet = new Set(symNums);
      const neededPadstacks = new Set();
      for (const fp of lib.parsed.footprints) {
        if (!symSet.has(fp.symNum)) continue;
        for (const pin of fp.pins) neededPadstacks.add(pin.padstack);
      }
      const thruBlocks = extractBlocks(lib.rawText, 'THRU').filter(blk => {
        const m = blk.match(/^\(THRU\s+(\d+)/); return m && neededPadstacks.has(parseInt(m[1]));
      });
      const symBlocks = extractBlocks(lib.rawText, 'SYM').filter(blk => {
        const m = blk.match(/^\(SYM\s+(\d+)/); return m && symSet.has(parseInt(m[1]));
      });
      const obsBlocks = extractBlocks(lib.rawText, 'Obs').filter(blk => {
        const m = blk.match(/\(Sym\s+(\d+)\)/); return m && symSet.has(parseInt(m[1]));
      });
      const textBlocks = extractBlocks(lib.rawText, 'Text').filter(blk => {
        const m = blk.match(/\(Sym\s+(\d+)\)/); return m && symSet.has(parseInt(m[1]));
      });
      const names = lib.parsed.footprints.filter(f => symSet.has(f.symNum)).map(f => f.name);
      return {
        thruBlocks, symBlocks, obsBlocks, textBlocks, names,
        mmPerUnit: lib.parsed.mmPerUnit,      // 대상 라이브러리와 단위가 다르면 붙여넣을 때 재환산용
        layerNames: lib.parsed.layerNames     // 대상 라이브러리와 레이어 번호가 다르면 이름으로 재매핑용
      };
    }

    function copySelectedFootprints() {
      const lib = currentLib();
      if (!lib) { addLog('❌ 복사할 라이브러리가 없습니다.'); return; }
      const symNums = selectedOrCurrentSymNums();
      if (symNums.length === 0) { addLog('❌ 복사할 풋프린트를 먼저 선택하세요.'); return; }
      clipboardBlocks = buildClipFromLib(lib, symNums);
      addLog(`📋 복사: ${clipboardBlocks.names.join(', ')} (${clipboardBlocks.names.length}개)`);
    }

    // 패드스택(THRU)의 레이어 목록을 "대상 라이브러리의 레이어" 기준으로 다시 만든다.
    // 원본과 대상은 레이어 개수·번호가 다를 수 있다(예: 17레이어 라이브러리 -> 28레이어 보드).
    // 원본 항목의 번호만 바꿔서 그대로 두면, 이름이 매칭된 것과 매칭 안 돼 원래 번호로 남은 것이
    // 같은 번호를 갖게 되어(중복) 일부 레이어는 아예 빠진다 -> MIN->LLB 변환이 실패한다(확인된 버그).
    // 그래서 대상 레이어 1..N을 전부 (UNDEF)로 깔아둔 뒤, 이름이 맞는 것만 제자리에 채운다.
    function rebuildPadstackLayerList(blk, srcLayerNames, dstNameToNum, dstLayerCount, rescaleNum, onUnmapped) {
      const byDst = {};
      for (const lblk of extractBlocks(blk, 'L')) {
        const lm = lblk.match(/^\(L\s+(\d+)/);
        if (!lm) continue;
        const srcNum = parseInt(lm[1]);
        const srcName = srcLayerNames[srcNum];
        const key = srcName ? srcName.toUpperCase() : null;
        const dstNum = (key !== null && dstNameToNum[key] !== undefined) ? dstNameToNum[key] : null;
        const isUndef = /\(UNDEF\)/.test(lblk);
        if (dstNum === null) {
          // 대응 레이어가 대상에 없음 -> 버린다. 원래 번호로 남기면 다른 레이어를 덮어써서 더 위험하다.
          if (!isUndef && onUnmapped) onUnmapped(srcName || ('L' + srcNum));
          continue;
        }
        if (isUndef) { byDst[dstNum] = '(UNDEF))'; continue; }
        let body = lblk.replace(/^\(L\s+\d+/, '');   // body는 L 블록을 닫는 ')'까지 포함
        let rotPart = '';
        body = body.replace(/\(R\s+-?[\d.]+\)/, (s) => { rotPart = s; return ' ROT '; }); // 회전각은 재환산 대상 아님
        body = body.replace(/-?[\d.]+/g, (s) => rescaleNum(s));
        body = body.replace(' ROT ', rotPart);
        byDst[dstNum] = body;
      }
      const out = [];
      for (let n = 1; n <= dstLayerCount; n++) out.push('(L ' + n + (byDst[n] !== undefined ? byDst[n] : '(UNDEF))'));
      return out;
    }

    // 재번호해서 대상 라이브러리에 밀어 넣는다. 이름이 이미 있으면 _2/_3...로 자동 변경.
    // 번호는 "원본번호 + 대상최대번호"가 아니라 대상 최대번호 다음부터 하나씩 순차로 매긴다.
    // 원본에서 일부만 복사되면(예: 안 쓰는 VIA 1~16은 빼고 패드스택 17번만 복사) 더하기 방식은
    // 36~51이 비고 52번만 생기는 식으로 번호에 구멍을 만들어 LLB 변환이 실패한다(확인된 버그).
    function pasteFootprints() {
      if (!clipboardBlocks) { addLog('❌ 클립보드가 비어 있습니다. 먼저 복사하세요.'); return; }
      const lib = currentLib();
      if (!lib) { addLog('❌ 붙여넣을 라이브러리를 먼저 선택하세요.'); return; }
      try {
        let thruCursor = getMaxNum(lib.rawText, 'THRU');
        let symCursor = getMaxNum(lib.rawText, 'SYM');
        let obsCursor = getMaxNum(lib.rawText, 'Obs');
        let textCursor = getMaxNum(lib.rawText, 'Text');
        let uidCursor = getMinUid(lib.rawText) - 1;

        // 원본과 대상 라이브러리의 단위(InchFactor)가 다르면 좌표/치수를 재환산해야 한다.
        const scale = clipboardBlocks.mmPerUnit / lib.parsed.mmPerUnit;
        if (Math.abs(scale - 1) > 1e-6) addLog(`ℹ️ 단위 배율 보정: ${scale.toFixed(4)}배 (원본/대상 InchFactor가 다름)`);
        const rescaleNum = (s) => String(Math.round(parseFloat(s) * scale));

        // 원본 레이어 번호 -> 이름 -> 대상 레이어 번호로 재매핑 (없으면 원래 번호를 그대로 씀 — 최선의 추측)
        const dstNameToNum = {};
        for (const n in lib.parsed.layerNames) dstNameToNum[lib.parsed.layerNames[n].toUpperCase()] = parseInt(n);
        const layerRemapLog = new Set();
        function mapLayerNum(srcNum) {
          const name = clipboardBlocks.layerNames[srcNum];
          if (name && dstNameToNum[name.toUpperCase()] !== undefined) return dstNameToNum[name.toUpperCase()];
          if (name) layerRemapLog.add(`레이어 "${name}"(원본 ${srcNum}번)에 대응하는 레이어가 대상 라이브러리에 없어 번호를 그대로 사용함`);
          return srcNum;
        }

        const thruMap = {};
        const thruBlocksOut = clipboardBlocks.thruBlocks.map(blk => {
          const m = blk.match(/^\(THRU\s+(\d+)/);
          if (!m) return blk;
          const oldNum = parseInt(m[1]); const newNum = ++thruCursor;
          thruMap[oldNum] = newNum;
          let out = blk.replace(/^\(THRU\s+\d+/, '(THRU ' + newNum);
          out = out.replace(/\(Uid\s+-?\d+\)/, '(Uid ' + (uidCursor--) + ')');
          // 대상 라이브러리의 레이어 구성에 맞추어 레이어 목록을 통째로 다시 만든다(번호 중복/누락 방지)
          const rebuiltLBlocks = rebuildPadstackLayerList(
            out, clipboardBlocks.layerNames, dstNameToNum, lib.parsed.layerCount, rescaleNum,
            (nm) => layerRemapLog.add(`패드스택 레이어 "${nm}"가 대상 라이브러리에 없어 제외됨`));
          for (const lblk of extractBlocks(out, 'L')) out = out.replace(lblk, '');
          out = out.replace(/(\(LgThermal[^)]*\)\(DirectHit[^)]*\)\s*)/, '$1' + rebuiltLBlocks.join('\n  ') + '\n  ');
          return out;
        });

        const existingNames = new Set(lib.parsed.footprints.map(f => f.name));
        function uniqueName(base) {
          if (!existingNames.has(base)) return base;
          let i = 2;
          while (existingNames.has(base + '_' + i)) i++;
          return base + '_' + i;
        }

        const symMap = {};
        const renameLog = [];
        const symBlocksOut = clipboardBlocks.symBlocks.map(blk => {
          const m = blk.match(/^\(SYM\s+(\d+)\(N\s+"([^"]*)"/);
          if (!m) return blk;
          const oldNum = parseInt(m[1]);
          const origName = m[2];
          const newNum = ++symCursor;
          symMap[oldNum] = newNum;

          let finalName = origName;
          if (existingNames.has(origName)) {
            finalName = uniqueName(origName);
            renameLog.push(`${origName} → ${finalName} (이름 충돌)`);
          }
          existingNames.add(finalName);

          let out = blk.replace(/^\(SYM\s+\d+\(N\s+"[^"]*"/, '(SYM ' + newNum + '(N "' + finalName + '"');
          out = out.replace(/\(Uid\s+-?\d+/, '(Uid ' + (uidCursor--));
          // (Derived N)은 부모 SYM 번호를 가리킨다. 부모도 같이 붙여넣었으면 새 번호로 바꾸고,
          // 아니면 0(원본)으로 돌려 엉뚱한 풋프린트를 가리키지 않게 한다.
          out = out.replace(/\(Derived\s+(\d+)\)/, (w, dn) => {
            const old = parseInt(dn);
            if (!old) return '(Derived 0)';
            return '(Derived ' + (symMap[old] !== undefined ? symMap[old] : 0) + ')';
          });
          out = out.replace(/(\(P\s+\d+\(N\s+"[^"]*"\)\s+)(-?[\d.]+)\s+(-?[\d.]+)\s+(\d+)/g,
            (whole, prefix, x, y, ps) => prefix + rescaleNum(x) + ' ' + rescaleNum(y) + ' ' +
              (thruMap[parseInt(ps)] !== undefined ? thruMap[parseInt(ps)] : ps));
          return out;
        });

        // OrCAD은 이름 없는 Obs/Text의 (N "-9500xx") 자동이름을 그 객체의 (Uid ...)와 항상 동일하게 유지한다.
        // Uid만 새로 매기고 이 이름 문자열을 안 바꾸면(둘이 어긋나면) Layout Plus가 Import 중 오류를 낸다.
        function resyncAutoNameToUid(text, newUid) {
          return text.replace(/\(N\s+"-?\d+"\)(?=\(Uid)/, '(N "' + newUid + '")');
        }

        const obsBlocksOut = clipboardBlocks.obsBlocks.map(blk => {
          const m = blk.match(/^\(Obs\s+(\d+)/);
          let out = m ? blk.replace(/^\(Obs\s+\d+/, '(Obs ' + (++obsCursor)) : blk;
          const newUid = uidCursor--;
          out = resyncAutoNameToUid(out, newUid);
          out = out.replace(/\(Uid\s+-?\d+\)/, '(Uid ' + newUid + ')');
          out = out.replace(/\(Sym\s+(\d+)\)/, (w, sn) => '(Sym ' + (symMap[parseInt(sn)] !== undefined ? symMap[parseInt(sn)] : sn) + ')');
          out = out.replace(/\(L\s+(\d+)\)/, (w, ln) => '(L ' + mapLayerNum(parseInt(ln)) + ')');
          out = out.replace(/\(W\s+(-?[\d.]+)\)/, (w, wv) => '(W ' + rescaleNum(wv) + ')');
          out = out.replace(/\((-?[\d.]+)\s+(-?[\d.]+)\)/g, (w, x, y) => '(' + rescaleNum(x) + ' ' + rescaleNum(y) + ')');
          return out;
        });
        const textBlocksOut = clipboardBlocks.textBlocks.map(blk => {
          const m = blk.match(/^\(Text\s+(\d+)/);
          let out = m ? blk.replace(/^\(Text\s+\d+/, '(Text ' + (++textCursor)) : blk;
          const newUid = uidCursor--;
          out = resyncAutoNameToUid(out, newUid);
          out = out.replace(/\(Uid\s+-?\d+\)/, '(Uid ' + newUid + ')');
          out = out.replace(/\(Sym\s+(\d+)\)/, (w, sn) => '(Sym ' + (symMap[parseInt(sn)] !== undefined ? symMap[parseInt(sn)] : sn) + ')');
          out = out.replace(/\(L\s+(\d+)\)/, (w, ln) => '(L ' + mapLayerNum(parseInt(ln)) + ')');
          out = out.replace(/\(W\s+(-?[\d.]+)\)/, (w, wv) => '(W ' + rescaleNum(wv) + ')');
          out = out.replace(/\(H\s+(-?[\d.]+)\)/, (w, hv) => '(H ' + rescaleNum(hv) + ')');
          out = out.replace(/\((-?[\d.]+)\s+(-?[\d.]+)\)\(Sym/, (w, x, y) => '(' + rescaleNum(x) + ' ' + rescaleNum(y) + ')(Sym');
          return out;
        });

        const appendage = '\n' + [...thruBlocksOut, ...symBlocksOut, ...obsBlocksOut, ...textBlocksOut].join('\n');
        const idx = lib.rawText.lastIndexOf('(End)');
        if (idx === -1) { addLog('❌ 붙여넣기 실패 — (End) 위치를 못 찾았습니다.'); return; }
        lib.rawText = lib.rawText.slice(0, idx) + appendage + '\n' + lib.rawText.slice(idx);
        lib.parsed = parseMIN(lib.rawText);

        // 내용이 완전히 같은 기존 풋프린트가 있으면 안내(막지는 않음)
        const dupLog = [];
        const newSymNums = Object.values(symMap);
        for (const symNum of newSymNums) {
          const fp = lib.parsed.footprints.find(f => f.symNum === symNum);
          if (!fp) continue;
          const sig = footprintSignature(fp, lib.parsed);
          const twin = lib.parsed.footprints.find(f => f.symNum !== symNum && footprintSignature(f, lib.parsed) === sig);
          if (twin) dupLog.push(`${fp.name}은(는) 기존 ${twin.name}와 내용이 동일합니다.`);
        }

        addLog(`📥 붙여넣기 완료: 풋프린트 ${symBlocksOut.length}개 → ${lib.name}`);
        renameLog.forEach(m => addLog('&nbsp;&nbsp;✏️ ' + m));
        dupLog.forEach(m => addLog('&nbsp;&nbsp;⚠️ ' + m));
        layerRemapLog.forEach(m => addLog('&nbsp;&nbsp;⚠️ ' + m));
        addLog('⚠️ 재번호/붙여넣기는 아직 실제 Layout Plus Import로 검증 안 됨 — 저장 후 임포트해서 꼭 확인하세요.');

        selectedFpSymNums = new Set(); fpSelectAnchorSymNum = null;
        refreshLibList();
        if (newSymNums.length > 0) selectFootprint(newSymNums[0]);
        else refreshFpList();
      } catch (err) {
        addLog('❌ 붙여넣기 실패: ' + err.message);
      }
    }

    // 라이브러리마다 "다음에 쓸" THRU/SYM 번호와 Uid 커서를 기억해둔다 — kicad2min.py의 카운터(17/-900001/1/-950001)와
    // 정확히 같은 값에서 시작하고, "Add KiCad..."를 여러 번 눌러도 이어서 커지기만 하지 절대 재사용하지 않는다.
    // Uid는 계속 "내려가면서" 발급되므로, 시작값 하나만 비어 있으면 되는 게 아니라 그 아래 구간 전체가
    // 비어 있어야 안전하다. 그래서 이미 쓰인 것 중 가장 작은 값보다 더 아래에서 시작한다.
    // (겹치면 서로 다른 객체가 같은 Uid를 갖게 되어 Layout Plus Import에서 그림이 뒤섞인다 — 확인된 버그)
    function findSafeUidStart(rawText, preferredStart) {
      let minUsed = 0;
      for (const m of rawText.matchAll(/\(Uid\s+(-?\d+)/g)) minUsed = Math.min(minUsed, parseInt(m[1]));
      return Math.min(preferredStart, minUsed - 1);
    }

    function ensureKicadCounters(lib) {
      if (lib.kicadThruNum === undefined) lib.kicadThruNum = Math.max(16, getMaxNum(lib.rawText, 'THRU')) + 1;
      if (lib.kicadSymNum === undefined) lib.kicadSymNum = getMaxNum(lib.rawText, 'SYM') + 1;
      // Obs/Text의 "레코드 번호"도 라이브러리 안에서 유일해야 한다. 1번부터 다시 매기면 기존 풋프린트의
      // Obs/Text와 번호가 겹쳐서, Layout Plus가 나중 것으로 덮어써 원본의 실크가 사라지고 텍스트 내용이
      // 바뀐다(실제로 확인된 버그). 그래서 기존 최대 번호 다음부터 이어서 매긴다.
      if (lib.kicadObsId === undefined) lib.kicadObsId = getMaxNum(lib.rawText, 'Obs') + 1;
      if (lib.kicadTextId === undefined) lib.kicadTextId = getMaxNum(lib.rawText, 'Text') + 1;
      if (lib.kicadPadstackUid === undefined) lib.kicadPadstackUid = findSafeUidStart(lib.rawText, -900001);
      // 공용(SYM/Obs/Text) Uid 대역은 패드스택 대역보다 항상 아래에 두어 둘이 만나지 않게 한다.
      if (lib.kicadSharedUid === undefined) {
        lib.kicadSharedUid = Math.min(findSafeUidStart(lib.rawText, -950001), lib.kicadPadstackUid - 50000);
      }
    }

    // pasteFootprints()와 달리 번호/Uid를 다시 매기지 않는다 — convertKicadModsToClipboard()가 이미
    // kicad2min.py와 동일한 방식(겹치지 않는 카운터)으로 값을 매겨서 내놓기 때문에, 그대로 이어붙이기만 하면
    // kicad2min.py가 만드는 것과 구조가 같은 결과가 나온다. 단위(InchFactor)/레이어 번호가 다른 대상
    // 라이브러리에 넣을 때를 위한 재환산·레이어 재매핑, 이름 충돌 회피만 pasteFootprints()에서 그대로 가져왔다.
    function addKicadClipboardToLibrary(lib, result) {
      const scale = result.mmPerUnit / lib.parsed.mmPerUnit;
      if (Math.abs(scale - 1) > 1e-6) addLog(`ℹ️ 단위 배율 보정: ${scale.toFixed(4)}배 (KiCad 변환 단위/대상 InchFactor가 다름)`);
      const rescaleNum = (s) => String(Math.round(parseFloat(s) * scale));

      const dstNameToNum = {};
      for (const n in lib.parsed.layerNames) dstNameToNum[lib.parsed.layerNames[n].toUpperCase()] = parseInt(n);
      const layerRemapLog = new Set();
      function mapLayerNum(srcNum) {
        const name = result.layerNames[srcNum];
        if (name && dstNameToNum[name.toUpperCase()] !== undefined) return dstNameToNum[name.toUpperCase()];
        if (name) layerRemapLog.add(`레이어 "${name}"(원본 ${srcNum}번)에 대응하는 레이어가 대상 라이브러리에 없어 번호를 그대로 사용함`);
        return srcNum;
      }

      const thruBlocksOut = result.thruBlocks.map(blk => {
        let out = blk;
        const rebuiltLBlocks = rebuildPadstackLayerList(
          out, result.layerNames, dstNameToNum, lib.parsed.layerCount, rescaleNum,
          (nm) => layerRemapLog.add(`패드스택 레이어 "${nm}"가 대상 라이브러리에 없어 제외됨`));
        for (const lblk of extractBlocks(out, 'L')) out = out.replace(lblk, '');
        out = out.replace(/(\(LgThermal[^)]*\)\(DirectHit[^)]*\)\s*)/, '$1' + rebuiltLBlocks.join('\n  ') + '\n  ');
        return out;
      });

      const existingNames = new Set(lib.parsed.footprints.map(f => f.name));
      function uniqueName(base) {
        if (!existingNames.has(base)) return base;
        let i = 2;
        while (existingNames.has(base + '_' + i)) i++;
        return base + '_' + i;
      }

      const renameLog = [];
      const symBlocksOut = result.symBlocks.map(blk => {
        const m = blk.match(/^\(SYM\s+(\d+)\(N\s+"([^"]*)"/);
        if (!m) return blk;
        const origName = m[2];
        let finalName = origName;
        if (existingNames.has(origName)) {
          finalName = uniqueName(origName);
          renameLog.push(`${origName} → ${finalName} (이름 충돌)`);
        }
        existingNames.add(finalName);

        let out = blk.replace(/^\(SYM\s+\d+\(N\s+"[^"]*"/, '(SYM ' + m[1] + '(N "' + finalName + '"');
        out = out.replace(/(\(P\s+\d+\(N\s+"[^"]*"\)\s+)(-?[\d.]+)\s+(-?[\d.]+)\s+(\d+)/g,
          (whole, prefix, x, y, ps) => prefix + rescaleNum(x) + ' ' + rescaleNum(y) + ' ' + ps);
        return out;
      });

      const remapObsText = (blk) => {
        let out = blk;
        out = out.replace(/\(L\s+(\d+)\)/, (w, ln) => '(L ' + mapLayerNum(parseInt(ln)) + ')');
        out = out.replace(/\(W\s+(-?[\d.]+)\)/, (w, wv) => '(W ' + rescaleNum(wv) + ')');
        out = out.replace(/\(H\s+(-?[\d.]+)\)/, (w, hv) => '(H ' + rescaleNum(hv) + ')');
        out = out.replace(/\((-?[\d.]+)\s+(-?[\d.]+)\)/g, (w, x, y) => '(' + rescaleNum(x) + ' ' + rescaleNum(y) + ')');
        return out;
      };
      const obsBlocksOut = result.obsBlocks.map(remapObsText);
      const textBlocksOut = result.textBlocks.map(remapObsText);

      const appendage = '\n' + [...thruBlocksOut, ...symBlocksOut, ...obsBlocksOut, ...textBlocksOut].join('\n');
      const idx = lib.rawText.lastIndexOf('(End)');
      if (idx === -1) { addLog('❌ 추가 실패 — (End) 위치를 못 찾았습니다.'); return; }
      lib.rawText = lib.rawText.slice(0, idx) + appendage + '\n' + lib.rawText.slice(idx);
      lib.parsed = parseMIN(lib.rawText);

      lib.kicadThruNum = result.nextThruNum;
      lib.kicadPadstackUid = result.nextPadstackUid;
      lib.kicadSymNum = result.nextSymNum;
      lib.kicadSharedUid = result.nextSharedUid;
      lib.kicadObsId = result.nextObsId;
      lib.kicadTextId = result.nextTextId;

      renameLog.forEach(m => addLog('&nbsp;&nbsp;✏️ ' + m));
      layerRemapLog.forEach(m => addLog('&nbsp;&nbsp;⚠️ ' + m));

      selectedFpSymNums = new Set(); fpSelectAnchorSymNum = null;
      refreshLibList();
      const firstNewSymNum = (result.symBlocks[0] || '').match(/^\(SYM\s+(\d+)/);
      if (firstNewSymNum) selectFootprint(parseInt(firstNewSymNum[1]));
      else refreshFpList();
    }

    // 선택한 풋프린트의 이름만 바꾼다. SYM 블록의 (N "...") 한 곳만 고치므로 형상·핀은 그대로다.
    function renameSelectedFootprint() {
      const lib = currentLib();
      if (!lib) { addLog('❌ 라이브러리가 없습니다.'); return; }
      const symNums = selectedOrCurrentSymNums();
      if (symNums.length === 0) { addLog('❌ 이름을 바꿀 풋프린트를 먼저 선택하세요.'); return; }
      if (symNums.length > 1) { addLog('❌ 이름 바꾸기는 한 번에 하나만 됩니다 — 하나만 선택하세요.'); return; }

      const symNum = symNums[0];
      const fp = lib.parsed.footprints.find(f => f.symNum === symNum);
      if (!fp) { addLog('❌ 풋프린트를 찾지 못했습니다.'); return; }

      const answer = prompt('풋프린트 이름 바꾸기', fp.name);
      if (answer === null) return;
      const newName = answer.trim().replace(/"/g, '');   // 이름은 따옴표로 감싸이므로 "는 제거
      if (!newName || newName === fp.name) return;
      if (lib.parsed.footprints.some(f => f.symNum !== symNum && f.name === newName)) {
        addLog(`❌ "${newName}"은(는) 이 라이브러리에 이미 있는 이름입니다.`);
        return;
      }

      const target = extractBlocks(lib.rawText, 'SYM').find(b => {
        const m = b.match(/^\(SYM\s+(\d+)/); return m && parseInt(m[1]) === symNum;
      });
      if (!target) { addLog('❌ SYM 블록을 찾지 못했습니다.'); return; }
      // 새 이름에 $ 같은 치환 패턴이 들어가도 안전하도록 함수 형태로 교체
      const renamed = target.replace(/^\(SYM\s+(\d+)\(N\s+"[^"]*"/, (w, num) => '(SYM ' + num + '(N "' + newName + '"');
      if (renamed === target) { addLog('❌ 이름 위치를 찾지 못했습니다.'); return; }
      lib.rawText = lib.rawText.replace(target, () => renamed);
      lib.parsed = parseMIN(lib.rawText);

      addLog(`✏️ 풋프린트 이름 변경: ${fp.name} → ${newName}`);
      refreshLibList();
      selectFootprint(symNum);
    }

    function deleteSelectedFootprints() {
      const lib = currentLib();
      if (!lib) return;
      const symNums = selectedOrCurrentSymNums();
      if (symNums.length === 0) { addLog('❌ 지울 풋프린트를 먼저 선택하세요.'); return; }
      const symSet = new Set(symNums);
      const names = lib.parsed.footprints.filter(f => symSet.has(f.symNum)).map(f => f.name);
      if (!confirm(`"${lib.name}"에서 ${names.length}개 풋프린트를 지울까요?\n${names.join(', ')}`)) return;

      // 남을 풋프린트들이 계속 쓰는 패드스택은 건드리지 않고, 삭제 대상만 독점 사용하던 패드스택만 같이 지운다.
      const stillUsedPadstacks = new Set();
      for (const fp of lib.parsed.footprints) {
        if (symSet.has(fp.symNum)) continue;
        for (const pin of fp.pins) stillUsedPadstacks.add(pin.padstack);
      }
      const toDeletePadstacks = new Set();
      for (const fp of lib.parsed.footprints) {
        if (!symSet.has(fp.symNum)) continue;
        for (const pin of fp.pins) if (!stillUsedPadstacks.has(pin.padstack)) toDeletePadstacks.add(pin.padstack);
      }

      let text = lib.rawText;
      for (const blk of extractBlocks(text, 'SYM')) {
        const m = blk.match(/^\(SYM\s+(\d+)/);
        if (m && symSet.has(parseInt(m[1]))) text = text.replace(blk, '');
      }
      for (const blk of extractBlocks(text, 'THRU')) {
        const m = blk.match(/^\(THRU\s+(\d+)/);
        if (m && toDeletePadstacks.has(parseInt(m[1]))) text = text.replace(blk, '');
      }
      for (const blk of extractBlocks(text, 'Obs')) {
        const m = blk.match(/\(Sym\s+(\d+)\)/);
        if (m && symSet.has(parseInt(m[1]))) text = text.replace(blk, '');
      }
      for (const blk of extractBlocks(text, 'Text')) {
        const m = blk.match(/\(Sym\s+(\d+)\)/);
        if (m && symSet.has(parseInt(m[1]))) text = text.replace(blk, '');
      }
      lib.rawText = text;
      lib.parsed = parseMIN(text);

      addLog(`🗑️ 삭제: ${names.join(', ')} (다른 풋프린트가 안 쓰던 패드스택 ${toDeletePadstacks.size}개도 같이 정리됨)`);
      selectedFpSymNums = new Set(); fpSelectAnchorSymNum = null;
      refreshLibList();
      if (lib.parsed.footprints.length > 0) {
        const first = [...lib.parsed.footprints].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }))[0];
        selectFootprint(first.symNum);
      } else {
        files = {}; currentSymNum = null; refreshFpList(); refreshLayerList(); draw();
        status.textContent = `${lib.name} — 풋프린트 없음`;
      }
    }

    // =======================================================
    // IX. KiCad .kicad_mod 가져오기
    // (D:\KiCad_to_Layout(사본)\kicad2min.py 의 파서/렌더 로직을 그대로 이식)
    // =======================================================
    const KICAD_UNITS_PER_MM = 100000;
    const KICAD_MASK_MARGIN_MM = 0.05;
    const KICAD_SILK_TOP_LAYER = 9; // SSTOP (본 뷰어의 새 라이브러리 골격 기준)
    const KICAD_NUM = '[-+]?\\d+\\.?\\d*(?:[eE][-+]?\\d+)?';
    // 새 라이브러리 골격의 표준 17레이어 이름 — 대상 라이브러리가 다른 레이어 번호 체계를 쓰면
    // pasteFootprints()의 이름 기반 재매핑이 이 이름들을 보고 올바른 번호로 바꿔준다.
    const KICAD_SKELETON_LAYER_NAMES = {
      0: '', 1: 'TOP', 2: 'BOTTOM', 3: 'PLANE', 4: 'INNER', 5: 'SMTOP', 6: 'SMBOT',
      7: 'SPTOP', 8: 'SPBOT', 9: 'SSTOP', 10: 'SSBOT', 11: 'ASYTOP', 12: 'ASYBOT',
      13: 'DRLDWG', 14: 'DRILL', 15: 'COMMENT', 16: 'SPARE2', 17: 'SPARE3'
    };

    function kmm(v) { return Math.round(v * KICAD_UNITS_PER_MM); }
    function kflipY(v) { return -v; } // KiCad Y+아래 -> OrCAD Y+위

    function parseKicadPad(block) {
      const m = block.match(/^\(pad\s+(?:"([^"]*)"|(\S+))\s+(\S+)\s+(\S+)/);
      if (!m) return null;
      const rawName = m[1] !== undefined ? m[1] : m[2];
      const name = rawName === 'None' ? '' : rawName;
      const pad = { name, type: m[3], shape: m[4] };
      const at = block.match(new RegExp('\\(at\\s+(' + KICAD_NUM + ')\\s+(' + KICAD_NUM + ')(?:\\s+(' + KICAD_NUM + '))?\\)'));
      pad.x = at ? parseFloat(at[1]) : 0;
      pad.y = at ? parseFloat(at[2]) : 0;
      const size = block.match(new RegExp('\\(size\\s+(' + KICAD_NUM + ')\\s+(' + KICAD_NUM + ')\\)'));
      pad.w = size ? parseFloat(size[1]) : 0;
      pad.h = size ? parseFloat(size[2]) : 0;
      const drill = block.match(new RegExp('\\(drill\\s+(?:oval\\s+)?(' + KICAD_NUM + ')'));
      pad.drill = drill ? parseFloat(drill[1]) : null;
      const layers = block.match(/\(layers\s+([^)]*)\)/);
      pad.layers = layers ? layers[1] : '';
      pad.isBottom = pad.layers.includes('B.Cu') && !pad.layers.includes('F.Cu');
      return pad;
    }

    function parseKicadRectlike(block) {
      const start = block.match(new RegExp('\\(start\\s+(' + KICAD_NUM + ')\\s+(' + KICAD_NUM + ')\\)'));
      const end = block.match(new RegExp('\\(end\\s+(' + KICAD_NUM + ')\\s+(' + KICAD_NUM + ')\\)'));
      const width = block.match(new RegExp('\\(width\\s+(' + KICAD_NUM + ')\\)'));
      const layer = block.match(/\(layer\s+(?:"([^"]+)"|(\S+?))\)/);
      if (!start || !end) return null;
      return {
        x1: parseFloat(start[1]), y1: parseFloat(start[2]),
        x2: parseFloat(end[1]), y2: parseFloat(end[2]),
        width: width ? parseFloat(width[1]) : 0.15,
        layer: layer ? (layer[1] || layer[2]) : ''
      };
    }

    function parseKicadCircle(block) {
      const center = block.match(new RegExp('\\(center\\s+(' + KICAD_NUM + ')\\s+(' + KICAD_NUM + ')\\)'));
      const end = block.match(new RegExp('\\(end\\s+(' + KICAD_NUM + ')\\s+(' + KICAD_NUM + ')\\)'));
      const width = block.match(new RegExp('\\(width\\s+(' + KICAD_NUM + ')\\)'));
      const layer = block.match(/\(layer\s+(?:"([^"]+)"|(\S+?))\)/);
      if (!center || !end) return null;
      const cx = parseFloat(center[1]), cy = parseFloat(center[2]);
      const ex = parseFloat(end[1]), ey = parseFloat(end[2]);
      return { cx, cy, r: Math.hypot(ex - cx, ey - cy), width: width ? parseFloat(width[1]) : 0.15, layer: layer ? (layer[1] || layer[2]) : '' };
    }

    function parseKicadFpText(block) {
      const m = block.match(/^\(fp_text\s+(\S+)\s+(?:"((?:[^"\\]|\\.)*)"|(\S+))/);
      if (!m) return null;
      const content = m[2] !== undefined ? m[2] : m[3];
      const at = block.match(new RegExp('\\(at\\s+(' + KICAD_NUM + ')\\s+(' + KICAD_NUM + ')(?:\\s+(' + KICAD_NUM + '))?\\)'));
      const layerM = block.match(/\(layer\s+(?:"([^"]+)"|(\S+?))\)/);
      return {
        type: m[1], content,
        x: at ? parseFloat(at[1]) : 0, y: at ? parseFloat(at[2]) : 0,
        layer: layerM ? (layerM[1] || layerM[2]) : ''
      };
    }

    function safeKicadName(raw) { return raw.replace(/[^A-Za-z0-9_.\-]/g, '_').slice(0, 64); }

    function parseKicadFootprint(text, fallbackName) {
      const name = safeKicadName(fallbackName + '_Ki');

      const pads = [], skippedPads = [];
      for (const blk of extractBlocks(text, 'pad')) {
        const p = parseKicadPad(blk);
        if (!p) continue;
        if (!['circle', 'rect', 'oval', 'roundrect'].includes(p.shape)) { skippedPads.push(p); continue; }
        pads.push(p);
      }

      const silkLines = [], silkCircles = [];
      for (const blk of extractBlocks(text, 'fp_line')) {
        const d = parseKicadRectlike(blk);
        if (d && (d.layer === 'F.SilkS' || d.layer === 'B.SilkS')) silkLines.push(d);
      }
      for (const blk of extractBlocks(text, 'fp_rect')) {
        const d = parseKicadRectlike(blk);
        if (d && (d.layer === 'F.SilkS' || d.layer === 'B.SilkS')) {
          const { x1, y1, x2, y2, width: w } = d;
          silkLines.push({ x1, y1, x2, y2: y1, width: w });
          silkLines.push({ x1: x2, y1, x2, y2, width: w });
          silkLines.push({ x1: x2, y1: y2, x2: x1, y2, width: w });
          silkLines.push({ x1, y1: y2, x2: x1, y2: y1, width: w });
        }
      }
      for (const blk of extractBlocks(text, 'fp_circle')) {
        const d = parseKicadCircle(blk);
        if (d && (d.layer === 'F.SilkS' || d.layer === 'B.SilkS')) silkCircles.push(d);
      }

      let courtyard = null;
      for (const blk of extractBlocks(text, 'fp_rect')) {
        const d = parseKicadRectlike(blk);
        if (d && d.layer === 'F.CrtYd') { courtyard = d; break; }
      }

      const labels = [];
      for (const blk of extractBlocks(text, 'fp_text')) {
        const t = parseKicadFpText(blk);
        if (t && t.type !== 'reference') labels.push(t);
      }

      return { name, pads, skippedPads, silkLines, silkCircles, courtyard, labels };
    }

    function kicadRenderPadstack(num, name, pad, uid) {
      function rectOrRound(wMm, hMm) {
        if (pad.shape === 'circle') return `(Round ${Math.floor(kmm(Math.max(wMm, hMm)) / 2)})`;
        const hw = Math.floor(kmm(wMm) / 2), hh = Math.floor(kmm(hMm) / 2);
        return `(Rect ${hw} ${hh} ${hw} ${hh})`;
      }
      const layers = {};
      for (let n = 1; n <= 17; n++) layers[n] = '(UNDEF)';
      let nonPlated = 'Off';
      if (pad.type === 'np_thru_hole') {
        const drillMm = pad.drill || Math.max(pad.w, pad.h);
        layers[14] = `(Round ${Math.floor(kmm(drillMm) / 2)})`; // Round는 반지름
        nonPlated = 'On';
      } else if (pad.type === 'thru_hole') {
        const cu = rectOrRound(pad.w, pad.h);
        const mask = rectOrRound(pad.w + 2 * KICAD_MASK_MARGIN_MM, pad.h + 2 * KICAD_MASK_MARGIN_MM);
        for (const n of [1, 2, 3, 4]) layers[n] = cu;
        layers[5] = mask; layers[6] = mask;
        const drillMm = pad.drill || Math.min(pad.w, pad.h) * 0.5;
        layers[14] = `(Round ${Math.floor(kmm(drillMm) / 2)})`; // Round는 반지름
      } else { // smd
        const cu = rectOrRound(pad.w, pad.h);
        const mask = rectOrRound(pad.w + 2 * KICAD_MASK_MARGIN_MM, pad.h + 2 * KICAD_MASK_MARGIN_MM);
        if (pad.isBottom) { layers[2] = cu; layers[6] = mask; } else { layers[1] = cu; layers[5] = mask; }
      }
      const lines = [`(THRU ${num}(N "${name}")(Uid ${uid})(BlockHolder Off)(TestPt Off)(NonPlated ${nonPlated})`,
        '  (LgThermal Off)(DirectHit Off)'];
      for (let n = 1; n <= 17; n++) lines.push(`  (L ${n}${layers[n]})`);
      lines.push('  )');
      return lines.join('\n');
    }

    class KicadPadstackRegistry {
      constructor(startNum, startUid) { this.nextNum = startNum; this.map = new Map(); this.blocks = []; this.uid = startUid; }
      _allocUid() { const u = this.uid; this.uid--; return u; }
      getOrCreate(pad) {
        const key = [pad.shape, pad.w.toFixed(3), pad.h.toFixed(3), pad.drill, pad.type, pad.isBottom].join('|');
        if (this.map.has(key)) return this.map.get(key);
        const num = this.nextNum++;
        const name = `AUTO_${pad.type.toUpperCase()}_${num}`;
        this.blocks.push(kicadRenderPadstack(num, name, pad, this._allocUid()));
        this.map.set(key, num);
        return num;
      }
    }

    function kicadRenderSymbol(symNum, uid, fp, registry) {
      const lines = [`(SYM ${symNum}(N "${fp.name}")(Uid ${uid} 0 0 0 0)(Derived 0)`];
      fp.pads.forEach((pad, i) => {
        const pnum = registry.getOrCreate(pad);
        const pinName = pad.name || String(i + 1);
        lines.push(`  (P ${i + 1}(N "${pinName}") ${kmm(pad.x)} ${kmm(kflipY(pad.y))} ${pnum})`);
      });
      lines.push('  )');
      return lines.join('\n');
    }

    function kicadRenderLineObs(obsId, uid, symNum, layer, widthMm, ptsMm) {
      const ptsTxt = ptsMm.map(([x, y]) => `(${kmm(x)} ${kmm(kflipY(y))})`).join(' ');
      return `(Obs ${obsId}(N "-${Math.abs(uid)}")(Uid ${uid})(OutLine)(NoFill)(Grid 0)(Created)(Sym ${symNum})(L ${layer})(W ${kmm(widthMm)})(NoNet) ${ptsTxt})`;
    }
    function kicadRenderCircleObs(obsId, uid, symNum, layer, widthMm, cx, cy, r) {
      const p1 = [kmm(cx + r), kmm(kflipY(cy))], p2 = [kmm(cx), kmm(kflipY(cy - r))], p3 = p1;
      return `(Obs ${obsId}(N "-${Math.abs(uid)}")(Uid ${uid})(KeepOut)(SolidFill)(Grid 0)(Circle)(Created)(Sym ${symNum})(L ${layer})(W ${kmm(widthMm)})(NoNet) (${p1[0]} ${p1[1]}) (${p2[0]} ${p2[1]})(CW) (${p3[0]} ${p3[1]}))`;
    }
    function kicadRenderCompoutlineObs(obsId, uid, symNum, ptsMm) {
      const ptsTxt = ptsMm.map(([x, y]) => `(${kmm(x)} ${kmm(kflipY(y))})`).join(' ');
      return `(Obs ${obsId}(N "-${Math.abs(uid)}")(Uid ${uid})(CompOutline)(NoFill)(Grid 0)(Created)(Sym ${symNum})(L 0)(W 100)(NoNet) ${ptsTxt})`;
    }
    function kicadRenderTextObs(textId, uid, symNum, layer, xMm, yMm) {
      return `(Text ${textId}(N "&Comp")(N "-${Math.abs(uid)}")(Uid ${uid})(W 12700)(H 127000) (${kmm(xMm)} ${kmm(kflipY(yMm))})(Sym ${symNum})(Aspect 100)(L ${layer})(RefDes))`;
    }
    function kicadRenderLabelObs(textId, uid, symNum, layer, xMm, yMm, content) {
      const safe = content.replace(/"/g, "'");
      return `(Text ${textId}(N "${safe}")(N "-${Math.abs(uid)}")(Uid ${uid})(W 12700)(H 127000) (${kmm(xMm)} ${kmm(kflipY(yMm))})(Sym ${symNum})(Aspect 100)(L ${layer}))`;
    }
    function kicadFpRefY(fp) {
      if (fp.courtyard) return Math.min(fp.courtyard.y1, fp.courtyard.y2) - 1.0;
      const ys = fp.pads.map(p => p.y);
      return ys.length ? Math.min(...ys) - 1.0 : 0.0;
    }

    // 여러 .kicad_mod 파일 -> pasteFootprints()가 바로 받아쓸 수 있는 clipboardBlocks 형태로 변환
    // startThruNum/startPadstackUid/startSymNum/startSharedUid: kicad2min.py와 동일한 값(17/-900001/1/-950001)이 기본값 —
    // 이미 검증된 그 규칙을 그대로 재사용. 같은 라이브러리에 여러 번 추가할 때는 ensureKicadCounters()가 이어서 넘겨줌.
    function convertKicadModsToClipboard(fileList, startThruNum = 17, startPadstackUid = -900001, startSymNum = 1, startSharedUid = -950001, startObsId = 1, startTextId = 1) {
      const registry = new KicadPadstackRegistry(startThruNum, startPadstackUid);
      const symBlocksOut = [];
      const obsTextBlocksOut = [];
      let obsId = startObsId, textId = startTextId, uidCounter = startSharedUid;
      const nextUid = () => uidCounter--;
      const warnings = [], names = [];

      fileList.forEach((file, idx) => {
        const fp = parseKicadFootprint(file.text, file.name.replace(/\.kicad_mod$/i, ''));
        if (fp.pads.length === 0) { warnings.push(`${fp.name}: 유효한 패드가 없어 건너뜀`); return; }
        for (const sp of fp.skippedPads) warnings.push(`${fp.name}/${sp.name}: 지원 안 하는 패드 모양 '${sp.shape}' — 이 핀은 제외됨`);

        const symNum = startSymNum + idx;
        symBlocksOut.push(kicadRenderSymbol(symNum, nextUid(), fp, registry));
        names.push(fp.name);

        for (const ln of fp.silkLines) { obsTextBlocksOut.push(kicadRenderLineObs(obsId, nextUid(), symNum, KICAD_SILK_TOP_LAYER, ln.width, [[ln.x1, ln.y1], [ln.x2, ln.y2]])); obsId++; }
        for (const c of fp.silkCircles) { obsTextBlocksOut.push(kicadRenderCircleObs(obsId, nextUid(), symNum, KICAD_SILK_TOP_LAYER, c.width, c.cx, c.cy, c.r)); obsId++; }
        if (fp.courtyard) {
          const cyd = fp.courtyard;
          const pts = [[cyd.x1, cyd.y1], [cyd.x2, cyd.y1], [cyd.x2, cyd.y2], [cyd.x1, cyd.y2], [cyd.x1, cyd.y1]];
          obsTextBlocksOut.push(kicadRenderCompoutlineObs(obsId, nextUid(), symNum, pts)); obsId++;
        }
        obsTextBlocksOut.push(kicadRenderTextObs(textId, nextUid(), symNum, KICAD_SILK_TOP_LAYER, 0.0, kicadFpRefY(fp))); textId++;
        for (const lbl of fp.labels) { obsTextBlocksOut.push(kicadRenderLabelObs(textId, nextUid(), symNum, KICAD_SILK_TOP_LAYER, lbl.x, lbl.y, lbl.content)); textId++; }
      });

      return {
        thruBlocks: registry.blocks,
        symBlocks: symBlocksOut,
        obsBlocks: obsTextBlocksOut.filter(b => b.startsWith('(Obs')),
        textBlocks: obsTextBlocksOut.filter(b => b.startsWith('(Text')),
        names, warnings,
        mmPerUnit: 0.00001, // 10nm/unit — 이 뷰어의 새 라이브러리 골격과 동일 관례
        layerNames: KICAD_SKELETON_LAYER_NAMES,
        // 다음 "Add KiCad..." 호출이 이어받을 커서 — kicad2min.py처럼 번호/uid를 절대 재사용하지 않음
        nextThruNum: registry.nextNum,
        nextPadstackUid: registry.uid,
        nextSymNum: startSymNum + fileList.length,
        nextSharedUid: uidCounter,
        nextObsId: obsId,
        nextTextId: textId
      };
    }

    document.getElementById('addKicadFile').addEventListener('change', async e => {
      const files = Array.from(e.target.files);
      e.target.value = '';
      if (files.length === 0) return;
      if (!currentLib()) {
        const baseName = files[0].name.replace(/\.kicad_mod$/i, '');
        createNewLibraryNamed(baseName);
      }
      try {
        const lib = currentLib();
        ensureKicadCounters(lib);
        const fileList = await Promise.all(files.map(async f => ({ name: f.name, text: await f.text() })));
        const result = convertKicadModsToClipboard(fileList, lib.kicadThruNum, lib.kicadPadstackUid, lib.kicadSymNum, lib.kicadSharedUid, lib.kicadObsId, lib.kicadTextId);
        if (result.symBlocks.length === 0) { addLog('❌ 변환 가능한 KiCad 풋프린트가 없습니다.'); return; }
        result.warnings.forEach(w => addLog('⚠️ ' + w));
        addLog(`🔄 KiCad → MIN 변환: ${result.names.join(', ')} (${result.names.length}개)`);
        addLog('⚠️ Y축 부호를 KiCad(Y+아래) → OrCAD(Y+위)로 반전했습니다 — 붙여넣은 뒤 핀 방향을 육안으로 꼭 확인하세요.');
        addKicadClipboardToLibrary(lib, result);
      } catch (err) {
        addLog('❌ KiCad 변환 실패: ' + err.message);
      }
    });

    // =======================================================
    // X. Save as LLB -> Layout Plus 실행 (브릿지 서버 경유, 인수 없음)
    // =======================================================
    async function saveCurrentLibraryAsLLB() {
      const ok = confirm('※ MIN → LLB 확실한 변환 방법\n① Save(또는 Save As)로 .MIN 저장\n② Layout Plus 실행\n③ File → Import → MIN Interchange\n④ 입력에 저장한 .MIN, 출력 이름 지정\n⑤ "Processing completed"와 Padstacks/Footprints 개수 확인\n\n지금 Layout Plus를 실행합니다.');
      if (!ok) return;
      addLog('🚀 Layout Plus 실행 중...');
      try {
        const res = await fetch(BRIDGE_URL.replace('/convert', '/launch-layout-plus'), { method: 'POST' });
        if (!res.ok) { const msg = await res.text(); throw new Error(msg); }
        addLog('🚀 Layout Plus 실행 요청 완료. File → Import → MIN Interchange로 직접 진행하세요.');
      } catch (err) {
        addLog(`❌ Layout Plus 실행 실패: ${err.message}`);
      }
    }

    // =======================================================
    // 서버(Layout_Library_Manager.py)와 이 페이지의 생사를 서로 감시한다.
    //   - 페이지를 닫으면 -> 서버가 하트비트 끊김을 감지하고 스스로 종료
    //   - 서버가 죽으면(창을 닫거나 Ctrl+C) -> 이 페이지가 하트비트 실패를 감지하고 안내 후 자동으로 탭을 닫음
    // file://로 직접 연 경우(서버 없음)에는 하트비트가 계속 실패하므로 아예 시작하지 않는다.
    // =======================================================
    (function initHeartbeat() {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return; // file://면 대상 서버가 없음
      const HEARTBEAT_URL = BRIDGE_URL.replace('/convert', '/heartbeat');
      const SHUTDOWN_URL = BRIDGE_URL.replace('/convert', '/shutdown');
      const INTERVAL_MS = 1500, MAX_MISS = 3; // 약 4~5초 안 되면 서버가 죽은 것으로 판단
      let missCount = 0, closedOverlayShown = false;

      function showServerClosedOverlay() {
        if (closedOverlayShown) return;
        closedOverlayShown = true;
        const div = document.createElement('div');
        div.style = 'position:fixed;inset:0;background:rgba(20,20,20,0.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:99999;text-align:center;padding:24px;font-family:"Segoe UI",sans-serif;';
        div.textContent = '⚠️ 서버(Layout_Library_Manager.py)가 종료되어 연결이 끊겼습니다. 이 창은 자동으로 닫힙니다.';
        document.body.appendChild(div);
        setTimeout(() => { try { window.close(); } catch (e) {} }, 1000);
      }

      function sendHeartbeat() {
        fetch(HEARTBEAT_URL, { method: 'POST' })
          .then(r => { missCount = r.ok ? 0 : missCount + 1; })
          .catch(() => { missCount++; })
          .finally(() => { if (missCount >= MAX_MISS) showServerClosedOverlay(); });
      }
      sendHeartbeat();
      setInterval(sendHeartbeat, INTERVAL_MS);

      // 탭/창을 정상적으로 닫을 때는 굳이 몇 초씩 기다리지 않고 바로 종료 신호를 보낸다.
      // sendBeacon은 페이지가 사라지는 도중에도 요청을 끝까지 보내주는 전용 API라 여기 딱 맞는다.
      window.addEventListener('pagehide', () => {
        try { navigator.sendBeacon(SHUTDOWN_URL); } catch (e) {}
      });
    })();

    // =======================================================
    // 초기화
    // =======================================================
    initColorPickers();
    debugDetailsDiv.innerHTML = INIT_MSG;
    refreshLibList();
  </script>

</body>
</html>
